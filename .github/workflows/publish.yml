# Publishes a release: validates the sources with the checks documented in
# CLAUDE.md, then attaches two zips of the unpacked extension to the Release.
#
# The normal path is automatic — release-please.yml's `publish` job calls this
# workflow as a reusable one in the same run, the moment a release is created.
# A reusable call is not an event, so it dodges the rule that blocks chaining:
# release-please creates its Release with the workflow token, and GitHub never
# starts a workflow from an event that token created.
#
# The other two triggers exist for the paths that are not a release-please run:
# a Release published by hand, and re-publishing (or backfilling) any tag.
# The web-store job is opt-in (see the comment on it).
name: publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.1)
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.1)
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check the scripts
        run: |
          node --check src/background.js
          node --check src/content.js
      - name: Parse the manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('release-please-config.json', 'utf8'))"

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Zip the unpacked extension
        # Only the runtime files go into the archive: manifest, icons and
        # scripts/styles. Repo scaffolding (workflows, docs, configs) stays
        # out, so the zip is exactly what Chrome loads and what a store
        # upload expects.
        run: |
          zip -q -r "olx-dark-theme-${TAG}.zip" manifest.json icons src
          # The stable name gives a permanent link:
          # github.com/OWNER/REPO/releases/latest/download/olx-dark-theme.zip
          zip -q -r olx-dark-theme.zip manifest.json icons src
      - name: Attach the zips to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload --clobber "$TAG"
          "olx-dark-theme-${TAG}.zip" olx-dark-theme.zip

  web-store:
    # Opt-in. To turn on: register on the Chrome Web Store developer console
    # (one-time $5), create the item once by hand, then add the repo secrets
    # CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
    # and set the repo variable PUBLISH_TO_WEB_STORE=true. Without the
    # variable this job never runs; with it, each publish run uploads to the
    # store as a draft for review. To fully auto-publish, add --auto-publish
    # to the upload command below.
    if: vars.PUBLISH_TO_WEB_STORE == 'true'
    needs: validate
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Zip the unpacked extension
        run: zip -q -r extension.zip manifest.json icons src
      - name: Upload draft to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli upload --source extension.zip
